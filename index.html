<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SOP Library — Harpoon Packaging</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- Add to Home Screen support (iOS Safari) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SOP Library">
<style>
:root {
    --navy:      #204667;
    --navy-dk:   #17324A;
    --navy-tint: #E8ECEF;
    --accent:    #9E1A41;
    --accent-dk: #71122E;
    --accent-bg: #F7ECEF;
    --green:   #2e7d32;
    --green-bg:#e8f5e9;
    --g100:    #f8f9fa;
    --g200:    #e9ecef;
    --g400:    #ced4da;
    --g600:    #6c757d;
    --g800:    #343a40;
    --red:     #dc3545;
    --shadow:  0 2px 8px rgba(0,0,0,.08);
    --r:       10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #eef0f4; color: var(--g800); padding-bottom: 40px; }

/* HEADER */
.hdr { background: var(--navy); color: white; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 200; box-shadow: 0 2px 10px rgba(0,0,0,.35); gap: 12px; }
.hdr-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.back-btn { background: rgba(255,255,255,.12); border: none; color: white; font-size: 15px; font-weight: 700; padding: 8px 12px; border-radius: 8px; cursor: pointer; display: none; -webkit-tap-highlight-color: transparent; flex-shrink: 0; }
.back-btn.show { display: inline-block; }
.hdr-text { min-width: 0; }
.hdr-text h1 { font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-text p  { font-size: 12px; opacity: .8; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-badge  { background: var(--accent); color: white; font-weight: 900; font-size: 12px; padding: 6px 12px; border-radius: 20px; letter-spacing: .4px; white-space: nowrap; flex-shrink: 0; }

/* LAYOUT */
.container { max-width: 900px; margin: 0 auto; padding: 16px; }

/* SEARCH */
.search-wrap { padding: 0 16px; max-width: 900px; margin: 14px auto 0; }
.search-box { width: 100%; border: 1.5px solid var(--g400); border-radius: 10px; padding: 13px 16px; font-size: 16px; background: white; box-shadow: var(--shadow); -webkit-appearance: none; }
.search-box:focus { outline: none; border-color: var(--navy); }

/* LIBRARY GRID */
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 16px; }
.sop-card { background: white; border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; border: 2px solid transparent; transition: transform .1s, border-color .1s; -webkit-tap-highlight-color: transparent; text-decoration: none; color: inherit; }
.sop-card.active:active { transform: scale(.98); }
.sop-card.active { border-color: var(--navy); }
.sop-card.locked { cursor: not-allowed; opacity: .55; }
.sop-code { font-size: 11px; font-weight: 800; letter-spacing: .5px; color: var(--navy); text-transform: uppercase; }
.sop-card.locked .sop-code { color: var(--g600); }
.sop-title { font-size: 15px; font-weight: 700; line-height: 1.3; }
.sop-meta { font-size: 11px; color: var(--g600); margin-top: auto; padding-top: 6px; }
.sop-status { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 20px; width: fit-content; }
.status-live { background: var(--green-bg); color: var(--green); }
.status-pending { background: var(--g200); color: var(--g600); }
.status-tablet { background: #E3EEF9; color: #1F4E79; }
.sop-card.memo { cursor: default; border-color: #1F4E79; }

/* LINE TABS */
.tabs { display: flex; gap: 8px; max-width: 900px; margin: 12px auto 0; padding: 0 16px; }
.tab { flex: 1; border: 1.5px solid var(--g400); background: white; color: var(--g800); font-size: 15px; font-weight: 700; padding: 11px 8px; border-radius: 10px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.tab.on { background: var(--navy); border-color: var(--navy); color: white; }

/* SECTION HEADERS */
.sec-hdr { display: flex; align-items: baseline; justify-content: space-between; margin-top: 22px; padding-bottom: 6px; border-bottom: 2px solid var(--navy); }
.sec-hdr h2 { font-size: 17px; color: var(--navy); }
.sec-hdr span { font-size: 12px; color: var(--g600); font-weight: 700; }
.sec-hdr + .lib-grid { margin-top: 12px; }

/* EMPTY / ERROR STATE */
.lib-msg { text-align: center; color: var(--g600); font-size: 13px; padding: 30px 16px; }

/* FOOTER */
.lib-footer { max-width: 900px; margin: 28px auto 0; padding: 20px 16px; text-align: center; }
.lib-footer img { height: 34px; opacity: .85; margin-bottom: 8px; }
.lib-footer .tag { font-size: 11px; color: var(--g600); letter-spacing: .3px; }
.lib-footer .note { font-size: 11px; color: var(--g600); margin-top: 10px; font-style: italic; }

/* VIEWS */
.view { display: none; }
.view.show { display: block; }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <div class="hdr-text">
      <h1>SOP Library</h1>
      <p>Harpoon Packaging · Can Line &amp; Racker · Barrel One Collective</p>
    </div>
  </div>
  <div class="hdr-badge" id="hdrBadge">…</div>
</div>

<!-- ============ LIBRARY VIEW ============ -->
<div id="libraryView" class="view show">
  <div class="tabs" id="tabs">
    <button class="tab" data-line="all" onclick="setLine('all')">All</button>
    <button class="tab" data-line="Can Line" onclick="setLine('Can Line')">Can Line</button>
    <button class="tab" data-line="Racker" onclick="setLine('Racker')">Racker</button>
  </div>
  <div class="search-wrap">
    <input class="search-box" id="searchBox" type="text" placeholder="Search SOPs by title or code…" oninput="filterLib()">
  </div>
  <div class="container">
    <div id="libGrid"></div>
  </div>
  <div class="lib-footer">
    <img src="logo.png" alt="Barrel One Collective">
    <div class="tag">LEGACY + INNOVATION</div>
    <div class="note">Gray tiles are SOPs still being written. They go live here as soon as they're finished.</div>
  </div>
</div>

<script>
// The SOP list lives in manifest.json (one entry per SOP: live or pending).
// To add or update an SOP: upload its PDF, then edit manifest.json. No code changes needed.
const LINES = ["Can Line", "Racker"];
let sops = [];
let line = "all";

function codeKey(c) { return c.split(".").slice(2).map(Number); }
function byCode(a, b) {
  const x = codeKey(a.code), y = codeKey(b.code);
  for (let i = 0; i < Math.max(x.length, y.length); i++) {
    const d = (x[i] || 0) - (y[i] || 0);
    if (d) return d;
  }
  return 0;
}
function esc(t) { const d = document.createElement("div"); d.textContent = t == null ? "" : String(t); return d.innerHTML; }

async function loadManifest() {
  try {
    const res = await fetch("manifest.json", { cache: "no-store" });
    sops = await res.json();
  } catch (e) {
    sops = [];
  }
  const p = new URLSearchParams(location.search).get("line");
  if (p && p.toLowerCase().startsWith("rack")) line = "Racker";
  else if (p && p.toLowerCase().startsWith("can")) line = "Can Line";
  renderLib();
}

function setLine(l) {
  line = l;
  try { history.replaceState(null, "", l === "all" ? location.pathname : "?line=" + (l === "Racker" ? "racker" : "canline")); } catch (e) {}
  renderLib(document.getElementById("searchBox").value);
}

function card(s) {
  const live = s.status !== "pending";
  // status "tablet": the SOP is a file saved on the tablet itself (e.g. a video), so the tile is a memo, not a link
  const onTablet = s.status === "tablet";
  const el = document.createElement(live && !onTablet ? "a" : "div");
  el.className = "sop-card " + (onTablet ? "memo" : live ? "active" : "locked");
  if (live && !onTablet) el.href = s.file + "?v=" + (s.version || 1);
  el.innerHTML = onTablet
    ? `<div class="sop-status status-tablet">▶ On this tablet</div>
       <div class="sop-code">${esc(s.code)}</div>
       <div class="sop-title">${esc(s.title)}</div>
       <div class="sop-meta">${esc(s.note)}</div>`
    : live
    ? `<div class="sop-status status-live">● Live</div>
       <div class="sop-code">${esc(s.code)}</div>
       <div class="sop-title">${esc(s.title)}</div>
       <div class="sop-meta">Updated ${esc(s.updated)}</div>`
    : `<div class="sop-status status-pending">🔒 Pending</div>
       <div class="sop-code">${esc(s.code)}</div>
       <div class="sop-title">${esc(s.title)}</div>
       <div class="sop-meta">Not yet published</div>`;
  return el;
}

function renderLib(filter) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.line === line));
  const grid = document.getElementById("libGrid");
  grid.innerHTML = "";
  const f = (filter || "").toLowerCase().trim();
  const inLine = sops.filter(s => line === "all" || s.line === line);
  const live = inLine.filter(s => s.status !== "pending").length;
  document.getElementById("hdrBadge").textContent = live + " / " + inLine.length + " LIVE";

  let shown = 0;
  LINES.forEach(L => {
    if (line !== "all" && line !== L) return;
    const list = sops.filter(s => s.line === L)
      .filter(s => !f ? true : (s.status !== "pending" && (s.code.toLowerCase().includes(f) || s.title.toLowerCase().includes(f))))
      .sort(byCode);
    if (!list.length) return;
    const all = sops.filter(s => s.line === L);
    const hdr = document.createElement("div");
    hdr.className = "sec-hdr";
    hdr.innerHTML = `<h2>${L}</h2><span>${all.filter(s => s.status !== "pending").length} live · ${all.filter(s => s.status === "pending").length} pending</span>`;
    const g = document.createElement("div");
    g.className = "lib-grid";
    list.forEach(s => g.appendChild(card(s)));
    grid.appendChild(hdr); grid.appendChild(g);
    shown += list.length;
  });

  if (!shown) {
    grid.innerHTML = f ? `<div class="lib-msg">No published SOPs match "${esc(filter)}".</div>`
                       : `<div class="lib-msg">No SOPs found.</div>`;
  }
}
function filterLib() { renderLib(document.getElementById("searchBox").value); }

loadManifest();
</script>

</body>
</html>
